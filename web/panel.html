<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel — Valentina García</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/camino.css?v=25">
<style>
  body{background:#FAFAF7}
  .pan{max-width:1240px;margin:0 auto;padding:0 20px 64px}
  .barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 18px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button,.chip{font:500 .88rem var(--font);border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--accent);box-shadow:0 3px 0 var(--ink)}
  select,.buscar{font:inherit;font-size:.88rem;border:1.5px solid #A9A6A0;border-radius:10px;padding:7px 10px;background:#fff;min-height:38px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 4px 0 var(--second)}
  .kpi b{display:block;font-size:1.75rem;font-weight:600;line-height:1.1}
  .kpi span{font-size:.8rem;color:var(--muted)}
  .caja{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:20px}
  .caja h2{font-size:1.15rem;margin:0 0 12px}
  .tabla{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:var(--accent);font-weight:600;position:sticky;top:0}
  td.n,th.n{text-align:right}
  td small{color:var(--muted);margin-left:4px}
  tr.total td{font-weight:600;background:var(--accent-soft)}
  .tag{display:inline-block;font-size:.74rem;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--ink)}
  .t-si{background:var(--second)} .t-ok{background:#DCF5E3} .t-mal{background:#FFE4EC}
  .wa{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;text-decoration:none;background:#DCF5E3;border:1px solid #1D9E75;border-radius:999px;padding:3px 10px;color:#0B5D43}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .grafico svg{width:100%;height:220px;display:block}
  .leyenda{display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin-top:6px}
  .leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .grid2{display:grid;gap:20px}
  @media(min-width:900px){.grid2{grid-template-columns:1.4fr 1fr}}
  .login{max-width:380px;margin:12vh auto;padding:0 20px}
  .login input{margin:12px 0}
  .nota{font-size:.8rem;color:var(--muted);margin-top:10px}
  #vista{padding:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 + "%" : "—";
const usd = n => "USD " + Number(n || 0).toLocaleString("es-CO", { maximumFractionDigits: 0 });
const PRODUCTOS = { "workshop": "Workshop (test)", "prompts": "Prompts 7-7-5" };
const prods = l => (l.productos && l.productos.length ? l.productos : ["workshop"]);
const CAMINOS = { "negocio": "Negocio", "marca-personal": "Marca personal", "ugc": "UGC", "por-definir": "Por definir" };
const fechaCorta = iso => new Date(iso).toLocaleString("es-CO", { timeZone: "America/Bogota", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
let clave = ""; try{ clave = localStorage.getItem("vm_panel") || ""; }catch(e){}
let D = null, pestana = "resumen", rango = "todo";
const filtro = { texto: "", camino: "", estado: "", producto: "" };

function login(msg){
  $("#app").innerHTML = `<div class="login"><img src="img/logo-valen.png" alt="Valentina García" width="200">
    <h1 style="font-size:1.6rem;margin-top:18px">Panel del lanzamiento</h1>
    <p class="small">Leads, ventas y embudo por cada link con UTM.</p>
    <form id="f"><label for="c">Clave</label><input id="c" type="password" autocomplete="current-password" required>
    <button class="btn block" type="submit">Entrar</button></form>${msg ? `<p class="msg">${esc(msg)}</p>` : ""}</div>`;
  $("#f").addEventListener("submit", e => { e.preventDefault(); clave = $("#c").value.trim(); cargar(); });
}

function desdeRango(){
  const d = new Date();
  if(rango === "hoy"){ d.setHours(0, 0, 0, 0); return d.toISOString(); }
  if(rango === "7") return new Date(Date.now() - 7 * 864e5).toISOString();
  if(rango === "30") return new Date(Date.now() - 30 * 864e5).toISOString();
  return "";
}

async function cargar(){
  const qs = desdeRango() ? "?desde=" + encodeURIComponent(desdeRango()) : "";
  const r = await fetch("/api/panel" + qs, { headers: { "x-panel-clave": clave } }).catch(() => null);
  if(!r || r.status === 401){ try{ localStorage.removeItem("vm_panel"); }catch(e){} return login(r ? "Clave incorrecta." : "Sin conexión."); }
  if(!r.ok){ const j = await r.json().catch(() => ({})); return login("No se pudieron leer los datos" + (j.detalle ? ": " + j.detalle : "") + "."); }
  try{ localStorage.setItem("vm_panel", clave); }catch(e){}
  D = await r.json();
  pintar();
}

function pintar(){
  const t = D.totales || {};
  $("#app").innerHTML = `<div class="pan">
    <div class="topbar"><span class="brand"><img src="img/logo-valen.png" alt="Valentina García" width="415" height="155"></span>
      <span class="small">Actualizado ${fechaCorta(D.actualizado)} · <a href="#" id="r">Actualizar</a> · <a href="#" id="s">Salir</a></span></div>
    <div class="barra">
      <div class="tabs" role="tablist">
        ${[["resumen","Resumen"],["embudo","Embudo por UTM"],["leads","Leads (" + D.leads.length + ")"],["ventas","Ventas (" + D.ventas.length + ")"]].map(([k, n]) => `<button role="tab" data-tab="${k}" aria-selected="${pestana === k}">${n}</button>`).join("")}
      </div>
      <select id="rango" aria-label="Rango de fechas">
        ${[["todo","Todo"],["hoy","Hoy"],["7","Últimos 7 días"],["30","Últimos 30 días"]].map(([k, n]) => `<option value="${k}"${rango === k ? " selected" : ""}>${n}</option>`).join("")}
      </select>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${t.visitas || 0}</b><span>Visitas</span></div>
      <div class="kpi"><b>${t.test_iniciado || 0}</b><span>Empezaron el test · ${pct(t.test_iniciado, t.visitas)}</span></div>
      <div class="kpi"><b>${t.leads || 0}</b><span>Leads · ${pct(t.leads, t.visitas)} de las visitas</span></div>
      <div class="kpi"><b>${t.indecisas || 0}</b><span>Indecisas (al grupo)</span></div>
      <div class="kpi"><b>${t.ventas || 0}</b><span>Ventas · ${pct(t.ventas, t.leads)} de los leads</span></div>
      <div class="kpi"><b>${usd(t.ingresos)}</b><span>Ingresos · ${t.reembolsos || 0} reembolsos</span></div>
    </div>
    <section id="vista"></section>
  </div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { pestana = b.dataset.tab; pintar(); }));
  $("#rango").addEventListener("change", e => { rango = e.target.value; cargar(); });
  $("#r").addEventListener("click", e => { e.preventDefault(); cargar(); });
  $("#s").addEventListener("click", e => { e.preventDefault(); try{ localStorage.removeItem("vm_panel"); }catch(err){} clave = ""; login(); });
  ({ resumen: vResumen, embudo: vEmbudo, leads: vLeads, ventas: vVentas })[pestana]();
}

function grafico(dias){
  if(!dias.length) return `<p class="small">Todavía no hay datos por día.</p>`;
  const W = 700, H = 200, P = 24, max = Math.max(1, ...dias.map(d => Math.max(d.leads, d.ventas)));
  const bw = (W - P * 2) / dias.length;
  const barras = dias.map((d, i) => {
    const x = P + i * bw, hl = (d.leads / max) * (H - P * 2), hv = (d.ventas / max) * (H - P * 2);
    return `<rect x="${x + bw * .12}" y="${H - P - hl}" width="${bw * .4}" height="${hl}" rx="3" fill="#E6DEFF" stroke="#111" stroke-width="1"><title>${d.dia}: ${d.leads} leads</title></rect>
            <rect x="${x + bw * .52}" y="${H - P - hv}" width="${bw * .36}" height="${hv}" rx="3" fill="#FFF393" stroke="#111" stroke-width="1"><title>${d.dia}: ${d.ventas} ventas</title></rect>
            ${dias.length <= 16 || i % Math.ceil(dias.length / 12) === 0 ? `<text x="${x + bw / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#5A5A5A">${d.dia.slice(5)}</text>` : ""}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Leads y ventas por día"><line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#DCD9D2"/>${barras}</svg>
    <div class="leyenda"><span><i style="background:#E6DEFF;border:1px solid #111"></i>Leads</span><span><i style="background:#FFF393;border:1px solid #111"></i>Ventas</span></div>`;
}

function vResumen(){
  const cam = D.por_camino || [];
  $("#vista").innerHTML = `<div class="grid2">
    <div class="caja grafico"><h2>Leads y ventas por día</h2>${grafico(D.diario || [])}</div>
    <div class="caja"><h2>Por camino</h2><div class="tabla"><table>
      <thead><tr><th>Camino</th><th class="n">Leads</th><th class="n">Ventas</th><th class="n">Conversión</th><th class="n">Ingresos</th></tr></thead>
      <tbody>${cam.map(c => `<tr><td>${esc(CAMINOS[c.camino] || c.camino)}</td><td class="n">${c.leads}</td><td class="n">${c.ventas}</td><td class="n">${pct(c.ventas, c.leads)}</td><td class="n">${usd(c.ingresos)}</td></tr>`).join("") || `<tr><td colspan="5">Sin leads todavía.</td></tr>`}</tbody>
    </table></div></div>
  </div>
  <div class="caja"><h2>Por producto</h2><div class="tabla"><table>
    <thead><tr><th>Producto</th><th class="n">Leads</th><th class="n">Compraron el workshop</th><th class="n">Conversión</th></tr></thead>
    <tbody>${Object.entries(PRODUCTOS).map(([k, n]) => { const ls = D.leads.filter(l => prods(l).includes(k)), c = ls.filter(l => l.compro).length;
      return `<tr><td>${esc(n)}</td><td class="n">${ls.length}</td><td class="n">${c}</td><td class="n">${pct(c, ls.length)}</td></tr>`; }).join("")}</tbody>
  </table></div></div>
  <div class="caja"><h2>Las 5 piezas que más leads traen</h2>${tablaEmbudo([...D.embudo].sort((a, b) => (b.leads || 0) - (a.leads || 0)).slice(0, 5), false)}</div>`;
}

function tablaEmbudo(filas, total){
  const t = filas.reduce((a, f) => { ["visitas","test_iniciado","llegaron_al_formulario","leads","clic_compra","ventas","ingresos"].forEach(k => a[k] = (a[k] || 0) + Number(f[k] || 0)); return a; }, {});
  const fila = (f, cls) => `<tr class="${cls || ""}"><td>${esc(f.fuente)}</td><td>${esc(f.medio)}</td><td>${esc(f.campana)}</td><td>${esc(f.pieza)}</td>
    <td class="n">${f.visitas || 0}</td><td class="n">${f.test_iniciado || 0}<small>${pct(f.test_iniciado, f.visitas)}</small></td>
    <td class="n">${f.llegaron_al_formulario || 0}</td><td class="n">${f.leads || 0}<small>${pct(f.leads, f.visitas)}</small></td>
    <td class="n">${f.clic_compra || 0}</td><td class="n">${f.ventas || 0}<small>${pct(f.ventas, f.leads)}</small></td><td class="n">${usd(f.ingresos)}</td></tr>`;
  return `<div class="tabla"><table>
    <thead><tr><th>Fuente</th><th>Medio</th><th>Campaña</th><th>Pieza</th><th class="n">Visitas</th><th class="n">Empezaron test</th><th class="n">Formulario</th><th class="n">Leads</th><th class="n">Clic compra</th><th class="n">Ventas</th><th class="n">Ingresos</th></tr></thead>
    <tbody>${filas.map(f => fila(f)).join("") || `<tr><td colspan="11">Todavía no hay visitas registradas.</td></tr>`}
    ${total && filas.length ? fila(Object.assign({ fuente: "Total", medio: "", campana: "", pieza: "" }, t), "total") : ""}</tbody></table></div>`;
}

function vEmbudo(){
  $("#vista").innerHTML = `<div class="caja"><h2>Embudo por UTM</h2>${tablaEmbudo(D.embudo, true)}
    <p class="nota">Cada persona cuenta una vez por visita. "(directo)" = llegó sin link con UTM. % de leads sobre visitas; % de ventas sobre leads. Las ventas se atribuyen a la UTM con la que la persona hizo el test.</p></div>`;
}

const waLink = l => { const n = String(l.whatsapp || "").replace(/\D/g, ""); return n ? `https://wa.me/${n}?text=${encodeURIComponent(`Hola ${String(l.nombre || "").split(" ")[0]}, te escribe el equipo de Valentina García 👋`)}` : ""; };

function leadsFiltrados(){
  const tx = filtro.texto.toLowerCase();
  return D.leads.filter(l =>
    (!filtro.camino || l.angulo === filtro.camino) &&
    (!filtro.producto || prods(l).includes(filtro.producto)) &&
    (!filtro.estado || (filtro.estado === "indecisas" && l.indeciso) || (filtro.estado === "compraron" && l.compro) || (filtro.estado === "sin_compra" && !l.compro)) &&
    (!tx || [l.nombre, l.email, l.whatsapp, l.utm_content, l.utm_campaign].join(" ").toLowerCase().includes(tx)));
}

function vLeads(){
  $("#vista").innerHTML = `<div class="caja"><h2>Leads</h2>
    <div class="filtros">
      <input class="buscar" id="tx" placeholder="Buscar nombre, correo, WhatsApp o pieza" value="${esc(filtro.texto)}" style="min-width:260px">
      <select id="fc"><option value="">Todos los caminos</option>${Object.entries(CAMINOS).map(([k, n]) => `<option value="${k}"${filtro.camino === k ? " selected" : ""}>${n}</option>`).join("")}</select>
      <select id="fp"><option value="">Todos los productos</option>${Object.entries(PRODUCTOS).map(([k, n]) => `<option value="${k}"${filtro.producto === k ? " selected" : ""}>${n}</option>`).join("")}</select>
      <select id="fe">${[["","Todos"],["indecisas","Indecisas"],["compraron","Compraron"],["sin_compra","Sin compra"]].map(([k, n]) => `<option value="${k}"${filtro.estado === k ? " selected" : ""}>${n}</option>`).join("")}</select>
      <button class="chip" id="csv">Descargar CSV</button>
    </div>
    <div class="tabla" id="tl"></div>
    <p class="nota">Máximo 1.000 leads por consulta; usa el rango de fechas si hay más.</p></div>`;
  const pintarTabla = () => {
    const ls = leadsFiltrados();
    $("#tl").innerHTML = `<table><thead><tr><th>Fecha</th><th>Nombre</th><th>WhatsApp</th><th>Correo</th><th>Camino</th><th>Producto</th><th>Estado</th><th>Bloqueo</th><th>Fuente</th><th>Pieza</th></tr></thead>
      <tbody>${ls.map(l => `<tr><td>${fechaCorta(l.created_at)}</td><td>${esc(l.nombre)}</td>
        <td>${waLink(l) ? `<a class="wa" href="${waLink(l)}" target="_blank" rel="noopener">${esc(l.whatsapp)} · Escribir</a>` : ""}</td>
        <td>${esc(l.email)}</td><td>${esc(CAMINOS[l.angulo] || l.angulo)}</td>
        <td>${prods(l).map(p => `<span class="tag">${esc(PRODUCTOS[p] || p)}</span>`).join(" ")}</td>
        <td>${l.compro ? `<span class="tag t-ok">Compró</span>` : l.indeciso ? `<span class="tag t-si">Indecisa</span>` : `<span class="tag">En lista</span>`}</td>
        <td>${esc(l.bloqueo)}</td><td>${esc(l.utm_source || "(directo)")}</td><td>${esc(l.utm_content)}</td></tr>`).join("") || `<tr><td colspan="10">No hay leads con estos filtros.</td></tr>`}</tbody></table>`;
  };
  pintarTabla();
  $("#tx").addEventListener("input", e => { filtro.texto = e.target.value; pintarTabla(); });
  $("#fc").addEventListener("change", e => { filtro.camino = e.target.value; pintarTabla(); });
  $("#fp").addEventListener("change", e => { filtro.producto = e.target.value; pintarTabla(); });
  $("#fe").addEventListener("change", e => { filtro.estado = e.target.value; pintarTabla(); });
  $("#csv").addEventListener("click", () => {
    const cols = ["created_at","nombre","email","whatsapp","angulo","productos","indeciso","compro","bloqueo","objetivo","situacion","utm_source","utm_medium","utm_campaign","utm_content"];
    const csv = [cols.join(",")].concat(leadsFiltrados().map(l => cols.map(c => `"${String(l[c] ?? "").replace(/"/g, '""')}"`).join(","))).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = "leads-valentina.csv"; a.click();
  });
}

function vVentas(){
  const est = { aprobada: "t-ok", reembolsada: "t-mal", contracargo: "t-mal", pendiente: "" };
  $("#vista").innerHTML = `<div class="caja"><h2>Ventas</h2><div class="tabla"><table>
    <thead><tr><th>Fecha</th><th>Correo</th><th>Producto</th><th class="n">Monto</th><th>Moneda</th><th>Camino</th><th>Estado</th><th>Pago</th></tr></thead>
    <tbody>${D.ventas.map(v => `<tr><td>${fechaCorta(v.created_at)}</td><td>${esc(v.email)}</td><td>${esc(v.producto)}</td><td class="n">${v.monto ?? ""}</td><td>${esc(v.moneda)}</td>
      <td>${esc(CAMINOS[v.angulo] || v.angulo || "—")}</td><td><span class="tag ${est[v.estado] || ""}">${esc(v.estado)}</span></td><td><small>${esc(v.transaccion_id)}</small></td></tr>`).join("") || `<tr><td colspan="8">Todavía no hay ventas.</td></tr>`}</tbody>
  </table></div><p class="nota">Las ventas llegan solas desde Whop. Los montos se guardan en USD.</p></div>`;
}

clave ? cargar() : login();
</script>
</body>
</html>
